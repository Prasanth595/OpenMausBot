# Own-server go/no-go spike (a throwaway branch, never merged): the published cloud-home image on a stock ubuntu-24.04
# host with Docker, one job per container security setting, each on a fresh VM, reporting health, the Admin's signed
# reads and pairing, and the bot box self-check. The scripts and profiles are in spike/own-server/.
name: spike-own-server

on:
  push:
    branches: [spike/own-server-ubuntu]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spike-own-server-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/milind-soni/openmausbot-cloud-home@sha256:495c1bd14a5677a1f9e8b6f8560e4971093e64bb07934fb8e8920de9f66da9d6

jobs:
  variant:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [a, b, c, bc, bcs, d, ds, dn, d4, cs, dnh, dsx, e, ec, ebc, ebcs, eds]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the variant
        env:
          VARIANT: ${{ matrix.variant }}
          OUT: ${{ runner.temp }}/spike/${{ matrix.variant }}
        run: bash spike/own-server/variant.sh "$VARIANT"
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spike-${{ matrix.variant }}
          path: ${{ runner.temp }}/spike/${{ matrix.variant }}
          retention-days: 30

  summary:
    needs: variant
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: spike-*
          path: ${{ runner.temp }}/spike
      - name: Report
        run: python3 spike/own-server/summary.py "$RUNNER_TEMP/spike" | tee -a "$GITHUB_STEP_SUMMARY"
